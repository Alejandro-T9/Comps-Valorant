<style>
/* Layout: barra fija con mapa y pestañas; debajo, la vista activa. Tarjetas con esquina cortada, estilo táctico oscuro. */
:root{
  --bg:#0f1923; --panel:#1b2733; --panel2:#243241; --line:#33465a;
  --fg:#ece8e1; --mut:#9aa8b6; --red:#ff4655; --red-d:#c93442;
  --ctl:#7e57c2; --ini:#e07b00; --sen:#1f8f82; --due:#d1495b; --unk:#8a8a8a;
  --ok:#3fb68b; --warn:#e3a72f; --bad:#e0566a;
  --f-d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-b:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-b);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:var(--red)}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}

header.top{padding:22px 0 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:clamp(28px,6vw,44px);line-height:1}
header.top h1 b{color:var(--red);font-weight:700}
.meta{color:var(--mut);font-size:13px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sel{display:flex;flex-direction:column;gap:2px;flex:1 1 200px;min-width:0}
.sel label{font-family:var(--f-d);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
select{background:var(--panel);border:1px solid var(--line);padding:10px 12px;min-height:44px;width:100%;font-weight:600;font-size:16px;appearance:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:3 1 380px;scrollbar-width:thin;padding-bottom:2px}
.tab{background:var(--panel);border:1px solid var(--line);padding:10px 14px;min-height:44px;cursor:pointer;
  font-family:var(--f-d);font-size:16px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab:hover:not([aria-selected="true"]){background:var(--panel2)}

.mapHead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:16px 0 4px}
.mapHead h2{font-size:34px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border:1px solid var(--line);color:var(--mut);letter-spacing:.03em}
.pill.dato{color:var(--ok);border-color:var(--ok)}
.pill.prac{color:var(--warn);border-color:var(--warn)}
.pill.crit{color:var(--mut)}
.conf-Alto{color:var(--ok);border-color:var(--ok)} .conf-Medio-Alto{color:var(--ok);border-color:var(--ok)}
.conf-Medio{color:var(--warn);border-color:var(--warn)} .conf-Medio-Bajo{color:var(--warn);border-color:var(--warn)} .conf-Bajo{color:var(--bad);border-color:var(--bad)}
.sub{color:var(--mut);margin:0 0 12px}

.panel{background:var(--panel);padding:16px}
.note{border:1px dashed var(--line);padding:10px 12px;color:var(--mut);font-size:13.5px;margin:12px 0}
.note b{color:var(--fg)}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.rolechip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-left:4px solid var(--c)}
.rolechip .n{font-family:var(--f-d);font-size:26px;line-height:1}
.rolechip.zero .n{color:var(--bad)}
.rolechip small{color:var(--mut);display:block;font-size:12px;line-height:1.1}
.cov{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cv{font-size:13px;padding:3px 10px;border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.cv i{font-style:normal;font-weight:700}
.cv.yes{color:var(--ok);border-color:var(--ok)} .cv.part{color:var(--warn);border-color:var(--warn)} .cv.no{color:var(--mut)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--panel);border:0;padding:0;text-align:left;display:flex;flex-direction:column;min-width:0;position:relative}
.card .pic{aspect-ratio:3/4;background:linear-gradient(180deg,var(--panel2),var(--panel));overflow:hidden;position:relative}
.card .pic img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card .pic::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(0deg,var(--panel),transparent)}
.card .body{padding:2px 10px 10px;display:flex;flex-direction:column;gap:5px}
.card h3{font-size:24px;line-height:1}
.card .role{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.card[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--red);background:var(--panel2)}
.card .rank{position:absolute;top:8px;left:8px;z-index:2;font-size:11px;font-weight:700;padding:1px 7px;background:var(--bg);color:var(--mut);letter-spacing:.05em}
.card .rank.alt{background:var(--warn);color:#1b1500}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.swap{margin-top:6px;background:transparent;border:1px solid var(--line);padding:8px;min-height:40px;cursor:pointer;font-size:13px;width:100%}
.swap:hover{border-color:var(--red);color:var(--red)}

.detail{margin-top:14px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
.detail .big{aspect-ratio:3/4;background:var(--panel2);overflow:hidden}
.detail .big img{width:100%;height:100%;object-fit:cover;object-position:top}
.detail h3{font-size:30px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.cols h4{margin:0 0 4px;font-family:var(--f-d);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.cols p{margin:4px 0}
.why{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
@media(max-width:560px){.detail{grid-template-columns:1fr}.detail .big{max-width:140px}}

.group{margin-bottom:14px}
.group>h3{font-size:22px;display:flex;gap:10px;align-items:center;margin-bottom:6px}
.group>h3 small{font-family:var(--f-b);font-size:13px;text-transform:none;letter-spacing:0;color:var(--mut);font-weight:400}
.row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;background:var(--panel);padding:10px;margin-bottom:6px;align-items:start}
.row .av{width:56px;aspect-ratio:3/4;overflow:hidden;background:var(--panel2)}
.row .av img{width:100%;height:100%;object-fit:cover;object-position:top}
.row b{font-family:var(--f-d);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.row p{margin:2px 0 0}

.seg{display:inline-flex;margin-bottom:12px}
.seg button{background:var(--panel);border:1px solid var(--line);padding:9px 18px;min-height:44px;cursor:pointer;font-family:var(--f-d);letter-spacing:.06em;text-transform:uppercase;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;background:var(--panel);padding:12px 14px}
.tl li::before{content:"";position:absolute;left:-26px;top:16px;width:12px;height:12px;background:var(--red);transform:rotate(45deg)}
.tl .t{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tl .t h3{font-size:22px}
.time{font-family:var(--f-d);font-size:18px;color:var(--red);letter-spacing:.04em}
.who{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.who div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);min-width:110px}
.who .ag{display:flex;gap:6px;align-items:center;background:var(--bg);padding:2px 10px 2px 2px}
.who .ag span.im{width:26px;height:26px;overflow:hidden;display:block;background:var(--panel2)}
.who .ag img{width:100%;height:100%;object-fit:cover;object-position:top 8%}
.who .none{color:var(--mut);font-size:13px}

.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.zone h3{font-size:20px;margin-bottom:8px}
.co{display:flex;flex-direction:column;gap:3px}
.co div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.co div span:last-child{color:var(--mut);text-align:right}
ul.plain{margin:6px 0;padding-left:20px} ul.plain li{margin:3px 0}
.srcs a{display:block;margin:3px 0;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;min-width:480px} th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
.tw{overflow-x:auto}
h2.sec{font-size:26px;margin:22px 0 8px}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kit .panel{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.kit .av{aspect-ratio:3/4;overflow:hidden;background:var(--panel2)}
.kit img{width:100%;height:100%;object-fit:cover;object-position:top}

.card .pos{margin:6px 0 0;font-size:13.5px;line-height:1.4}
.card .pos b{display:block;font-family:var(--f-d);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.card .pos .chips{margin-bottom:3px}
.alt{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.alt .im{width:36px;aspect-ratio:3/4;overflow:hidden;background:var(--panel2);display:block}
.alt img{width:100%;height:100%;object-fit:cover;object-position:top}
.alt small{display:block;font-weight:700;letter-spacing:.08em;color:var(--warn);font-size:11px}
.alt .role{font-size:11px}
footer{margin-top:30px;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:no-preference){.card,.tab,.swap{transition:background .15s,border-color .15s}}
</style>

function slots(m,useAlt){
 return m.comp.map((c,i)=>useAlt
  ?{i,name:c[3],alt:true,orig:c[0],ar:c[7],dr:c[8],atk:`Ocupa el puesto de ${c[0]}. No hay dato por mapa para ${c[3]}: usad las posiciones de su kit con el mismo rol que ${c[0]}.`,def:`Ocupa el puesto de ${c[0]}. No hay dato por mapa para ${c[3]}: usad las posiciones de su kit con el mismo rol que ${c[0]}.`,why:c[4],other:c[0],same:c[3]===c[0]}

function tokens(a){return (FUNC[a]||"").split(" · ")}
function coverage(sl){
 const r={};F7.forEach(f=>r[f]=0);
 sl.forEach(s=>tokens(s.name).forEach(t=>{
  if(t==="Flasher parcial"){if(!r.Flasher)r.Flasher=.5}
  else if(r[t]!==undefined)r[t]=1;
 }));
 return r;
}
function tagChips(arr,dict){return arr.map(k=>`<span class="chip">${esc(dict[k])}</span>`).join("")}

function block(sl,isAlt){
 const cnt={Controlador:0,Iniciador:0,Centinela:0,Duelista:0};
 sl.forEach(s=>cnt[ROLE[s.name]]++);
 const cov=coverage(sl);
 const stats=Object.keys(cnt).map(r=>`<div class="rolechip cut ${cnt[r]?"":"zero"}" style="--c:${RCOL[r]}"><span class="n">${cnt[r]}</span><span>${RPLUR[r]}<small>${cnt[r]?"en la comp":"ninguno: cubrid el hueco"}</small></span></div>`).join("");
 const cv=F7.map(f=>{const v=cov[f];const c=v===1?"yes":v?"part":"no";const sym=v===1?"✓":v?"~":"✗";return `<span class="cv ${c}" title="${esc(F7D[f])}"><i>${sym}</i>${f}</span>`}).join("");
 const cards=sl.map(s=>{
  const r=ROLE[s.name];
  const dato=/\d%/.test(s.why)?'<span class="pill dato">Dato</span>':'<span class="pill crit">Criterio</span>';
  const pos=isAlt?`<p class="pos"><b>${s.same?"Se mantiene":"Reemplaza a "+esc(s.orig)}</b>${esc(s.why)} ${dato}</p>`
   :`<p class="pos"><b>Ataque</b>${tagChips(s.ar,AR)}<br>${esc(s.atk)}</p><p class="pos"><b>Defensa</b>${tagChips(s.dr,DR)}<br>${esc(s.def)}</p>
     ${s.same?`<div class="alt"><span class="im"></span><div><small>SIN ALTERNATIVA</small>${esc(s.why)} ${dato}</div></div>`:`<div class="alt"><span class="im"><img src="${img(s.other)}" alt=""></span><div><small>ALTERNATIVA</small><b>${esc(s.other)}</b> <span class="role" style="color:${RCOL[ROLE[s.other]]}">${ROLE[s.other]}</span><br>${esc(s.why)} ${dato}</div></div>`}`;
  return `<div class="card cut" style="--c:${RCOL[r]}">
   <span class="rank ${s.alt?"alt":""}">${s.alt?(s.same?"IGUAL":"ALT."):"PRINCIPAL"}</span>
   <span class="pic"><img src="${img(s.name)}" alt="${esc(s.name)}"></span>
   <div class="body"><h3>${esc(s.name)}</h3><span class="role">${r}</span>
   <span class="chips">${tokens(s.name).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</span>${pos}</div></div>`}).join("");
 return `<div class="stats">${stats}</div><div class="cov" aria-label="Cobertura de las 7 funciones">${cv}</div><div class="grid">${cards}</div>`;
}

 const keys=atk?["entry","trade","humos","info","lurk","post"]:["anc","inf","ret","rot","lurk"];
 const dict=atk?AR:DR;
 const sub={entry:"Abre el duelo y crea espacio.",trade:"Entra justo detrás para castigar y vengar.",humos:"Tapa ángulos antes de la entrada.",info:"Da la información antes de comprometerse.",lurk:"Juega separado del equipo y cubre flancos.",post:"Mantiene la bomba tras plantar.",
  anc:"Aguanta un sitio y retrasa hasta que llegue ayuda.",inf:"Lee el empuje y avisa.",ret:"Frena el avance para ganar tiempo.",rot:"Rota al sitio atacado y hace el retake."}
 ;
 const g=order(sl,key,keys).filter(x=>x[1].length).map(([k,arr])=>`<div class="group"><h3>${dict[k]} <small>${sub[k]}</small></h3>${arr.map(s=>`<div class="row cut"><div class="av"><img src="${img(s.name)}" alt=""></div><div><b>${esc(s.name)}</b> ${s.alt?'<span class="pill prac">Alternativa</span>':""} <span class="pill prac">Práctica</span><p>${esc(atk?s.atk:s.def)}</p><p style="color:var(--mut);font-size:13.5px">${s.same?"Sin alternativa con respaldo. ":"Alternativa: <b>"+esc(s.other)+"</b>. "}${esc(s.why)}</p></div></div>`).join("")}</div>`).join("");
 return `<div class="note"><b>Cómo leer esto.</b> Los roles (entry, segunda entrada, lurk, ancla) siguen las definiciones de <a href="${S.dote[1]}" target="_blank" rel="noopener">Dot Esports</a>. A qué agente le toca cada uno en este mapa es criterio basado en su kit.</div>${g}`;
}
function who(sl,key,k){
 const a=sl.filter(s=>s[key].includes(k));
 return a.length?a.map(s=>`<span class="ag">${av(s.name)}${esc(s.name)}</span>`).join(""):`<span class="none">Nadie en esta comp</span>`;
}
function vTl(m,sl){
 const atk=st.side==="atk";
 const W=(k,l)=>`<div><span class="lab">${l}</span>${who(sl,atk?"ar":"dr",k)}</div>`;
 const D='<span class="pill dato">Dato</span>',P='<span class="pill prac">Práctica</span>';
 let ph;
 if(atk) ph=[
  ["Tomar espacio","0:00–0:15",D,"Salid y reclamad terreno neutral, sobre todo mid, sin pelear de más.",W("humos","Humos")+W("info","Info")],
  ["Default","0:15–0:40",D,"Repartíos por los carriles, usad la utilidad de recon y buscad picks baratos. El objetivo es que la defensa revele dónde está, no conseguir kills.",W("info","Info")+W("lurk","Lurk")],
  ["Lectura","Antes de comprometerse",D,"Antes de ir al sitio debéis tener lectura de al menos dos defensores y ojos en los carriles por donde pueden empujar.",W("info","Info")+W("lurk","Lurk")],
  ["Comprometer o fakear","0:40–0:55",D,"Si el sitio parece blando, ejecutad. Si la defensa lo apila, enseñad presión y rotad al otro.",W("humos","Humos")+W("lurk","Lurk")],
  ["Ejecución","0:55–1:15",D,"El orden es utilidad, luego entrada, luego trade, todo en unos 2–3 segundos. No hagáis dry-peek a un sitio sin humo o flash.",W("humos","1 · Utilidad")+W("info","1 · Info/flash")+W("entry","2 · Entrada")+W("trade","3 · Trade")],
  ["Plantar y post-plant","Plantar 4 s · bomba 45 s",D,"Plantad solo con el sitio limpio, en un lugar que el equipo pueda cubrir. Repartíos para cruzar los ángulos del retake. Defuse completo: 7 s; medio defuse: 3,5 s. Guardad una utilidad para los últimos segundos.",W("post","Post-plant")+W("lurk","Lurk")+W("humos","Humos del retake")]
 ];
 else ph=[
  ["Al inicio de la ronda","Sin tiempo fijo",P,"Colocad la utilidad de información y tomad vuestras posiciones. Nadie rota con la primera información.",W("inf","Info")+W("anc","Ancla")],
  ["Mientras ellos hacen el default","Sin tiempo fijo",P,"Retrasad y dad información sin gastar toda la utilidad. Los lurkers de defensa buscan el flanco o la espalda.",W("ret","Retraso")+W("inf","Info")+W("lurk","Lurk")],
  ["Contacto y rotación","Cuando hay ejecución",P,"Los anclas aguantan el sitio atacado; los demás rotan solo con información confirmada, con humos y retrasos para ganar tiempo.",W("anc","Ancla")+W("ret","Retraso")+W("rot","Rotación")],
  ["Retake tras la plantada","Bomba 45 s · defuse 7 s",D,"Con la bomba plantada el tiempo manda: el defuse completo cuesta 7 s y el medio defuse 3,5 s. Retomad juntos y con utilidad; con menos de unos 8 s hace falta medio defuse y volver.",W("rot","Retake")+W("anc","Ancla")+W("inf","Info")]
 ];
 return `<div class="seg"><button data-side="atk" aria-pressed="${atk}">Ataque</button><button data-side="def" aria-pressed="${!atk}">Defensa</button></div>
  <div class="note">${atk?`<b>Tiempos.</b> Las fases y los tiempos de ataque son la guía general de <a href="${S.mbmap[1]}" target="_blank" rel="noopener">MetaBot</a> y valen para cualquier mapa. Los tiempos de la bomba salen de <a href="${S.mbspike[1]}" target="_blank" rel="noopener">MetaBot</a>. Quién hace cada cosa en ${esc(m.name)} es ${P}.`:`<b>Tiempos.</b> No he encontrado una fuente con fases cronometradas de defensa, así que no invento segundos. Solo los tiempos de la bomba son dato (<a href="${S.mbspike[1]}" target="_blank" rel="noopener">MetaBot</a>).`}</div>
  <ol class="tl" style="list-style:none">${ph.map(p=>`<li><div class="t"><h3>${p[0]}</h3><span class="time">${p[1]}</span>${p[2]}</div><p style="margin:6px 0 0">${p[3]}</p><div class="who">${p[4]}</div></li>`).join("")}</ol>`;
}
function vMap(m){
 const zones=m.zones.map(([t,items])=>`<div class="panel cut zone"><h3>${t}</h3><div class="co">${items.map(i=>{const[e,s]=i.split("|");return `<div><span>${esc(e)}</span><span>${esc(s)}</span></div>`}).join("")}</div></div>`).join("");
 const src=m.csrc.map(k=>`<a href="${S[k][1]}" target="_blank" rel="noopener">${esc(S[k][0])}</a>`).join("");
 return `<div class="note"><b>Zonas en inglés y español.</b> Los nombres en inglés vienen de la guía citada. La columna en español es traducción literal mía: Riot no publica un nombre oficial en español para cada zona, así que en voz usad el nombre inglés.</div>
  <div class="zones">${zones}</div><h2 class="sec">Datos del mapa</h2><div class="panel cut"><ul class="plain">${m.mech.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <p style="margin:8px 0 0"><span class="pill dato">Dato</span> <span class="srcs">${src}</span></p></div>`;
}
function vGuide(){
 const kit=[["Miks","Controlador","Waveform es un humo instantáneo de unos 16 s; M-Pulse cura o aturde; Harmonize mejora cadencia y recarga de un aliado.","miks"],
  ["Hush","Duelista","Flashbulb (flash), Flow (dash), Displacement (atrae y aturde) y Suspension (ultimate). Llegó con el parche 13.09.","hush"],
  ["Tejo","Iniciador","Stealth Drone, Guided Salvo, Special Delivery (aturde) y Armageddon (ultimate).","tejo"],
  ["Veto","Centinela","Chokehold (trampa), Crosscut (teleport), Interceptor (destruye utilidad) y Evolution (ultimate).","veto"]];
 const kits=kit.map(k=>`<div class="panel cut"><div class="av"><img src="${img(k[0])}" alt=""></div><div><h3 style="font-size:22px">${k[0]}</h3><span class="pill" style="color:${RCOL[k[1]]};border-color:${RCOL[k[1]]}">${k[1]}</span><p style="margin:6px 0 0;font-size:14px">${k[2]}</p><a href="${S[k[3]][1]}" target="_blank" rel="noopener">${esc(S[k[3]][0])}</a></div></div>`).join("");
 const f7=F7.map(f=>`<tr><td><b>${f}</b></td><td>${esc(F7D[f])}</td></tr>`).join("");
 const roles=[["Entry","Gana el primer duelo y crea espacio; suelen ser duelistas."],["Segunda entrada","Mantiene el espacio que abre el entry y asegura el trade. Ejemplos de la fuente: Yoru, KAY/O, Omen, Brimstone, Chamber."],["Lurker","Toma ángulos inesperados por el flanco. Mejor encaje: controladores y centinelas."],["Soporte","Reúne información y cubre accesos para que el entry avance."],["Ancla (defensa)","Aguanta un sitio y retrasa; mantiene salida para rotar al retake."]]
  .map(r=>`<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td></tr>`).join("");
 const srcs=Object.values(S).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join("");
 return `<h2 class="sec">Las 7 funciones</h2><div class="panel cut tw"><table><tr><th>Función</th><th>Qué hace</th></tr>${f7}</table></div>
  <p class="sub" style="margin-top:8px">Qué función cumple cada agente lo he asignado por su kit. No es una estadística.</p>
  <h2 class="sec">Roles del equipo <span class="pill dato">Dato</span></h2><div class="panel cut tw"><table><tr><th>Rol</th><th>Definición</th></tr>${roles}</table></div>
  <h2 class="sec">Agentes nuevos</h2><p class="sub">Ninguno está en una comp porque no hay datos pro de este acto.</p><div class="kit">${kits}</div>
  <h2 class="sec">Límites</h2><div class="panel cut"><ul class="plain"><li>Ninguna fuente publica en qué segundo entra cada agente en cada mapa. Los tiempos de ataque son los de una guía general.</li><li>Las posiciones por agente son práctica basada en el kit. Confirmadlas en custom.</li><li>Premier del Acto 6 usa el mismo pool y rota por semana: Bind, Corrode, Sunset, Haven, Summit, Abyss y Lotus, con playoffs el 6 de diciembre. Las fechas exactas de cada semana no están verificadas: mirad el hub de Premier en el cliente.</li><li>El parche 13.09 bajó la velocidad extra de Clove del 15% al 10%. Por eso Clove solo queda como opción de ranked.</li><li>Las cifras de ranked de MetaBot cambian a diario y no se comparan directo con la presencia pro de vlr.gg.</li><li>Bind y Corrode no estuvieron en Champions 2026: uso Masters Santiago y los Kickoff de 2026 y Champions 2025. En Corrode, ningún dato pro es posterior al rework de 13.08.</li><li>Una presencia pro mide lo que eligen los equipos, no lo que ganan. Con 5 a 18 mapas por evento, diferencias de 10 a 20 puntos pueden ser ruido.</li><li>No pude verificar datos de ranked por rango (Diamante+ o Ascendente+).</li></ul></div>
  <h2 class="sec">Fuentes</h2><div class="panel cut srcs">${srcs}</div>`;
}

/* ---------- Render ---------- */
function render(){
 const m=MAPS[st.map],sl=slots(m,false);
 $("#tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${st.tab===t[0]}">${t[1]}</button>`).join("");
 let body;
 switch(st.tab){case"comp":body=vComp(m);break;case"atk":body=vRole(m,sl,"ar");break;case"def":body=vRole(m,sl,"dr");break;case"tl":body=vTl(m,sl);break;case"map":body=vMap(m);break;default:body=vGuide()}
 const head=st.tab==="guide"?"":`<div class="mapHead"><h2>${m.name}</h2><span class="pill conf-${m.conf}">Confianza ${m.conf}</span></div><p class="sub">${esc(m.sub)}</p>`;
 $("#view").innerHTML=head+body;
}
function init(){
 $("#mapSel").innerHTML=MAPS.map((m,i)=>`<option value="${i}">${m.name}</option>`).join("");
 const h=(location.hash||"").slice(1),i=MAPS.findIndex(m=>m.id===h);if(i>=0)st.map=i;
 $("#mapSel").value=st.map;
 $("#mapSel").addEventListener("change",e=>{st.map=+e.target.value;st.sel=0;try{history.replaceState(null,"","#"+MAPS[st.map].id)}catch(_){}render()});
 document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){st.tab=b.dataset.tab;render();window.scrollTo({top:0})}
  else if(b.dataset.swap!==undefined){const m=MAPS[st.map],k=+b.dataset.swap;(st.swap[m.id]=st.swap[m.id]||{})[k]=!st.swap[m.id][k];st.sel=k;render()}
  else if(b.dataset.sel!==undefined){st.sel=+b.dataset.sel;render()}
  else if(b.dataset.side){st.side=b.dataset.side;render()}
 });
 render();
}
init();
</script>
